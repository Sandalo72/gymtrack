<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymTrack · Medidas</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0c0c0e;
            --surface: #131316;
            --surface2: #1a1a1f;
            --border: #2a2a32;
            --accent: #c8f53e;
            --accent-dim: #8aaa1a;
            --accent-glow: rgba(200, 245, 62, 0.12);
            --text: #e8e8ec;
            --text-muted: #7a7a88;
            --text-dim: #4a4a58;
            --red: #ff5252;
            --green: #4dffb4;
            --radius: 12px;
            --radius-sm: 6px;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            line-height: 1.5;
            min-height: 100vh;
        }

        /* ─── NOISE TEXTURE ─── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            background-size: 200px;
            opacity: 0.6;
        }

        #app {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        /* ─── HEADER ─── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 28px 0 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 32px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            letter-spacing: 3px;
            color: var(--accent);
            text-shadow: 0 0 30px var(--accent-glow);
        }

        .logo span {
            color: var(--text-muted);
        }

        header nav {
            display: flex;
            gap: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.18s;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent);
            color: #0c0c0e;
        }

        .btn-primary:hover {
            background: #d8ff55;
            box-shadow: 0 0 20px rgba(200, 245, 62, 0.4);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
        }

        .btn-ghost:hover {
            color: var(--text);
            background: var(--surface2);
        }

        .btn-danger {
            background: transparent;
            color: var(--red);
            border: 1px solid rgba(255, 82, 82, 0.3);
        }

        .btn-danger:hover {
            background: rgba(255, 82, 82, 0.1);
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
        }

        .btn-back {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 0;
            transition: color 0.15s;
        }

        .btn-back:hover {
            color: var(--accent);
        }

        /* ─── DASHBOARD ─── */
        .section-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .person-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .person-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.25s;
        }

        .person-card:hover {
            border-color: rgba(200, 245, 62, 0.3);
            background: var(--surface2);
        }

        .person-card:hover::before {
            transform: scaleX(1);
        }

        .card-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.25rem;
            letter-spacing: 1.5px;
            color: var(--text);
            margin-bottom: 4px;
        }

        .card-goal {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--accent-dim);
            margin-bottom: 16px;
        }

        .card-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .card-stat {
            display: flex;
            flex-direction: column;
        }

        .card-stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-dim);
            margin-bottom: 2px;
        }

        .card-stat-value {
            font-family: 'DM Mono', monospace;
            font-size: 16px;
            color: var(--text);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .card-sessions {
            font-size: 11px;
            color: var(--text-dim);
        }

        .card-date {
            font-size: 11px;
            color: var(--text-dim);
            font-family: 'DM Mono', monospace;
        }

        .add-card {
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
            min-height: 160px;
            color: var(--text-dim);
        }

        .add-card:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-glow);
        }

        .add-card-icon {
            font-size: 2rem;
        }

        .add-card-label {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ─── PERSON DETAIL ─── */
        .person-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }

        .person-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 2px;
            line-height: 1;
            color: var(--text);
        }

        .person-goal-badge {
            display: inline-block;
            background: var(--accent-glow);
            color: var(--accent);
            border: 1px solid rgba(200, 245, 62, 0.3);
            border-radius: 20px;
            padding: 3px 12px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 6px;
        }

        .person-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ─── SESSIONS TABLE ─── */
        .sessions-block {
            margin-bottom: 40px;
        }

        .block-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .block-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        .table-wrap {
            overflow-x: auto;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--surface2);
        }

        th {
            text-align: left;
            padding: 10px 14px;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-dim);
            white-space: nowrap;
            font-weight: 500;
        }

        td {
            padding: 10px 14px;
            border-top: 1px solid var(--border);
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            white-space: nowrap;
        }

        tr:first-child td {
            border-top: none;
        }

        .td-label {
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .delta-pos {
            color: var(--green);
            font-size: 11px;
        }

        .delta-neg {
            color: var(--red);
            font-size: 11px;
        }

        .delta-zero {
            color: var(--text-dim);
            font-size: 11px;
        }

        .latest-val {
            color: var(--text);
            font-weight: 500;
        }

        .session-date-col {
            color: var(--accent);
        }

        /* ─── CHARTS ─── */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .chart-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }

        .chart-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 16px;
            font-weight: 500;
        }

        .chart-wrap {
            position: relative;
            height: 180px;
        }

        /* ─── MODAL ─── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.15s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 560px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.2s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            padding: 24px 24px 0;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }

        .modal-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 2px;
        }

        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1.2rem;
            padding: 4px;
            border-radius: var(--radius-sm);
            transition: color 0.15s;
        }

        .modal-close:hover {
            color: var(--text);
        }

        .modal-body {
            padding: 20px 24px;
        }

        .modal-footer {
            padding: 0 24px 24px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* ─── FORM ─── */
        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-input,
        .form-select {
            width: 100%;
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 9px 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            transition: border-color 0.15s;
            outline: none;
        }

        .form-input:focus,
        .form-select:focus {
            border-color: var(--accent);
        }

        .form-select option {
            background: var(--surface2);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-section {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem;
            letter-spacing: 2px;
            color: var(--accent);
            margin: 20px 0 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(200, 245, 62, 0.2);
        }

        .form-hint {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        /* ─── EMPTY STATE ─── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .empty-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        .empty-sub {
            font-size: 13px;
            margin-top: 6px;
        }

        /* ─── TOAST ─── */
        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 200;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 18px;
            font-size: 13px;
            color: var(--text);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        #toast.success {
            border-left: 3px solid var(--accent);
        }

        #toast.error {
            border-left: 3px solid var(--red);
        }

        /* ─── TABS ─── */
        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 28px;
        }

        .tab {
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-dim);
            padding: 10px 16px;
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
            margin-bottom: -1px;
        }

        .tab:hover {
            color: var(--text);
        }

        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* ─── DIFF SUMMARY ─── */
        .diff-banner {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 28px;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .diff-item {
            display: flex;
            flex-direction: column;
        }

        .diff-item-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .diff-item-val {
            font-family: 'DM Mono', monospace;
            font-size: 18px;
        }

        /* responsive */
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .person-title {
                font-size: 1.8rem;
            }
        }

        /* ─── SCROLLBAR ─── */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-dim);
        }

        /* ─── SPLASH SCREEN ─── */
        #splash-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .running-man {
            font-size: 5rem;
            animation: run 0.8s infinite ease-in-out;
            display: inline-block;
        }

        @keyframes run {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        .splash-text {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 3px;
            color: var(--accent);
            margin-top: 20px;
            text-shadow: 0 0 20px var(--accent-glow);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>

                    }]

        // ════════════════════════════════════════════
        //  UTILS
        // ════════════════════════════════════════════
        function uid() { return Math.random().toString(36).slice(2, 9); }
        function fmtDate(d) {
            if (!d) return '—';
            const [y, m, day] = d.split('-');
            return `${day}/${m}/${y}`;
        }
        function today() { return new Date().toISOString().split('T')[0]; }

        // ════════════════════════════════════════════
        //  STORAGE
        // ════════════════════════════════════════════
        function loadData() {
            try {
                const s = localStorage.getItem(STORAGE_KEY);
                if (s) return JSON.parse(s);
            } catch (e) { }
            const d = JSON.parse(JSON.stringify(DEFAULT_DATA));
            saveData(d); return d;
        }
        function saveData(d) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
        }

        // ════════════════════════════════════════════
        //  STATE
        // ════════════════════════════════════════════
        let state = {
            data: loadData(),
            view: 'dashboard',
            personId: null,
            tab: 'tabla',
            modal: null,   // null | 'addPerson' | 'addSession' | 'editPerson' | 'confirmDelete'
            deleteTarget: null,
            charts: {},
        };

        function getPerson(id) { return state.data.people.find(p => p.id === id); }
        function sortedSessions(p) { return [...p.sessions].sort((a, b) => a.date.localeCompare(b.date)); }

        // ════════════════════════════════════════════
        //  RENDER
        // ════════════════════════════════════════════
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = renderHeader() + (state.view === 'dashboard' ? renderDashboard() : renderPerson());
            bindEvents();
            if (state.view === 'person' && state.tab === 'graficos') renderCharts();
            if (state.modal) renderModal();
        }

        function renderHeader() {
            return `<header>
    <div class="logo">GymTrack<span> ·</span></div>
    <nav>
      <button class="btn btn-outline btn-sm" onclick="exportData()">⬇ Exportar</button>
      <label class="btn btn-outline btn-sm" style="cursor:pointer">
        ⬆ Importar <input type="file" accept=".json" style="display:none" onchange="importData(event)">
      </label>
    </nav>
  </header>`;
        }

        // ─── DASHBOARD ───
        function renderDashboard() {
            const people = state.data.people;
            const cards = people.map(p => {
                const sess = sortedSessions(p);
                const last = sess[sess.length - 1];
                const m = last?.m || {};
                return `<div class="person-card" onclick="openPerson('${p.id}')">
      <div class="card-name">${p.name}</div>
      <div class="card-goal">${p.goal || 'Sin objetivo'}</div>
      <div class="card-stats">
        ${m.pecho != null ? `<div class="card-stat"><span class="card-stat-label">Pecho</span><span class="card-stat-value">${m.pecho} cm</span></div>` : ''}
        ${m.cintura != null ? `<div class="card-stat"><span class="card-stat-label">Cintura</span><span class="card-stat-value">${m.cintura} cm</span></div>` : ''}
        ${m.gluteo != null ? `<div class="card-stat"><span class="card-stat-label">Glúteo</span><span class="card-stat-value">${m.gluteo} cm</span></div>` : ''}
        ${(m.brazo_izq != null || m.brazo_der != null) ? `<div class="card-stat"><span class="card-stat-label">Brazo</span><span class="card-stat-value">${m.brazo_der || m.brazo_izq} cm</span></div>` : ''}
      </div>
      <div class="card-meta">
        <span class="card-sessions">${sess.length} medición${sess.length !== 1 ? 'es' : ''}</span>
        <span class="card-date">${fmtDate(last?.date)}</span>
      </div>
    </div>`;
            }).join('');

            return `
    <p class="section-title">ATLETAS — ${people.length}</p>
    <div class="grid">
      ${cards}
      <div class="add-card" onclick="openModal('addPerson')">
        <div class="add-card-icon">＋</div>
        <div class="add-card-label">Agregar Atleta</div>
      </div>
    </div>`;
        }

        // ─── PERSON DETAIL ───
        function renderPerson() {
            const p = getPerson(state.personId);
            if (!p) return '';
            const sess = sortedSessions(p);

            return `
    <div>
      <button class="btn-back" onclick="goBack()">← Volver</button>
      <div class="person-header">
        <div>
          <div class="person-title">${p.name}</div>
          ${p.goal ? `<div class="person-goal-badge">${p.goal}</div>` : ''}
        </div>
        <div class="person-actions">
          <button class="btn btn-primary btn-sm" onclick="openModal('addSession')">＋ Nueva Medición</button>
          <button class="btn btn-outline btn-sm" onclick="openModal('editPerson')">✎ Editar</button>
          <button class="btn btn-danger btn-sm" onclick="confirmDelete('person','${p.id}')">✕ Eliminar</button>
        </div>
      </div>

      ${sess.length >= 2 ? renderDiffBanner(sess) : ''}

      <div class="tabs">
        <button class="tab ${state.tab === 'tabla' ? 'active' : ''}" onclick="switchTab('tabla')">📋 Tabla de Medidas</button>
        <button class="tab ${state.tab === 'graficos' ? 'active' : ''}" onclick="switchTab('graficos')">📈 Gráficos</button>
      </div>

      ${state.tab === 'tabla' ? renderTable(p, sess) : renderChartsLayout(p, sess)}
    </div>`;
        }

        function renderDiffBanner(sess) {
            const last = sess[sess.length - 1];
            const prev = sess[sess.length - 2];
            const highlights = ['pecho', 'cintura', 'gluteo', 'brazo_der', 'cuad_mayor_der'];
            const items = highlights.map(k => {
                const f = FIELDS.find(f => f.key === k);
                if (!f || last.m[k] == null || prev.m[k] == null) return '';
                const delta = (last.m[k] - prev.m[k]).toFixed(1);
                const better = f.lowerIsBetter ? delta < 0 : delta > 0;
                const cls = delta == 0 ? 'delta-zero' : (better ? 'delta-pos' : 'delta-neg');
                const sign = delta > 0 ? '+' : '';
                return `<div class="diff-item">
      <span class="diff-item-label">${f.label}</span>
      <span class="diff-item-val ${cls}">${sign}${delta} cm</span>
    </div>`;
            }).filter(Boolean).join('');
            if (!items) return '';
            return `<div class="diff-banner" title="Diferencia: ${fmtDate(prev.date)} → ${fmtDate(last.date)}">
    <div class="diff-item">
      <span class="diff-item-label">Período</span>
      <span class="diff-item-val" style="font-size:13px;color:var(--text-muted)">${fmtDate(prev.date)} → ${fmtDate(last.date)}</span>
    </div>
    ${items}
  </div>`;
        }

        function renderTable(p, sess) {
            if (!sess.length) return `<div class="empty-state"><div class="empty-icon">📏</div><div class="empty-title">Sin mediciones</div><div class="empty-sub">Agrega la primera medición</div></div>`;

            // Columns = sessions (desc order)
            const cols = [...sess].reverse();

            const groupedFields = {};
            FIELDS.forEach(f => { (groupedFields[f.group] = groupedFields[f.group] || []).push(f); });

            let rows = '';
            Object.entries(groupedFields).forEach(([grp, fields]) => {
                rows += `<tr><td colspan="${cols.length + 1}" style="background:var(--surface2);padding:8px 14px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);font-weight:500;">${grp}</td></tr>`;
                fields.forEach(f => {
                    const hasAny = cols.some(s => s.m[f.key] != null);
                    if (!hasAny) return;
                    let tds = '';
                    cols.forEach((s, i) => {
                        const val = s.m[f.key];
                        if (val == null) { tds += `<td style="color:var(--text-dim)">—</td>`; return; }
                        const prev = cols[i + 1];
                        let deltaHtml = '';
                        if (prev && prev.m[f.key] != null) {
                            const d = (val - prev.m[f.key]).toFixed(1);
                            const better = f.lowerIsBetter ? d < 0 : d > 0;
                            const cls = d == 0 ? 'delta-zero' : (better ? 'delta-pos' : 'delta-neg');
                            const sign = d > 0 ? '+' : '';
                            const arrow = d == 0 ? '' : (d > 0 ? ' ▲' : ' ▼');
                            deltaHtml = ` <span class="${cls}">${sign}${d} cm${arrow}</span>`;
                        }
                        tds += `<td><span class="latest-val">${val} cm</span>${deltaHtml}</td>`;
                    });
                    rows += `<tr><td class="td-label">${f.label}</td>${tds}</tr>`;
                });
            });

            const headers = cols.map((s, i) => `
    <th>
      <div style="display:flex;align-items:center;gap:6px">
        <span class="session-date-col">${fmtDate(s.date)}</span>
        ${i === 0 ? '<span style="font-size:9px;background:var(--accent-glow);color:var(--accent);padding:1px 5px;border-radius:3px">HOY</span>' : ''}
        <button class="btn btn-ghost btn-sm" style="padding:2px 4px;font-size:10px;" onclick="confirmDelete('session','${s.id}','${p.id}')" title="Eliminar sesión">✕</button>
      </div>
    </th>`).join('');

            return `<div class="sessions-block">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Medida</th>${headers}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
        }

        function renderChartsLayout(p, sess) {
            if (sess.length < 2) return `<div class="empty-state"><div class="empty-icon">📈</div><div class="empty-title">Necesitas 2+ mediciones</div><div class="empty-sub">Agrega otra medición para ver los gráficos de progreso</div></div>`;
            const groups = ['Torso', 'Brazos', 'Piernas'];
            return `<div class="charts-grid">${groups.map(g => `<div class="chart-card"><div class="chart-title">${g}</div><div class="chart-wrap"><canvas id="chart-${g}"></canvas></div></div>`).join('')}</div>`;
        }

        function renderCharts() {
            const p = getPerson(state.personId);
            if (!p) return;
            const sess = sortedSessions(p);
            if (sess.length < 2) return;

            const labels = sess.map(s => fmtDate(s.date));
            const COLORS = ['#c8f53e', '#4dffb4', '#7eb6ff', '#ffb347', '#ff7eb6', '#a78bfa'];

            const groups = {
                Torso: ['pecho', 'cintura', 'cadera', 'gluteo'],
                Brazos: ['brazo_izq', 'brazo_der'],
                Piernas: ['cuad_mayor_der', 'cuad_menor_der', 'pantorrilla_der', 'cuad_mayor_izq', 'cuad_menor_izq', 'pantorrilla_izq'],
            };

            Chart.defaults.color = '#7a7a88';
            Chart.defaults.borderColor = '#2a2a32';

            Object.entries(groups).forEach(([grp, keys]) => {
                const canvas = document.getElementById(`chart-${grp}`);
                if (!canvas) return;
                const datasets = keys.map((k, i) => {
                    const f = FIELDS.find(f => f.key === k);
                    return {
                        label: f?.label || k,
                        data: sess.map(s => s.m[k] ?? null),
                        borderColor: COLORS[i % COLORS.length],
                        backgroundColor: COLORS[i % COLORS.length] + '22',
                        borderWidth: 2, pointRadius: 4, tension: 0.3, fill: false,
                        spanGaps: true,
                    };
                }).filter(d => d.data.some(v => v != null));

                new Chart(canvas, {
                    type: 'line',
                    data: { labels, datasets },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 10, font: { family: 'DM Sans', size: 11 } } },
                            tooltip: { mode: 'index', intersect: false }
                        },
                        scales: {
                            x: { grid: { color: '#2a2a32' }, ticks: { font: { family: 'DM Mono', size: 11 } } },
                            y: { grid: { color: '#2a2a32' }, ticks: { font: { family: 'DM Mono', size: 11 }, callback: v => v + ' cm' } }
                        }
                    }
                });
            });
        }

        // ─── MODAL ───
        function renderModal() {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.id = 'modal-overlay';
            overlay.onclick = e => { if (e.target === overlay) closeModal(); };
            overlay.innerHTML = getModalContent();
            document.body.appendChild(overlay);
            bindModalEvents();

            // Focus first input
            setTimeout(() => {
                const first = overlay.querySelector('input:not([type=hidden]),select');
                if (first) first.focus();
            }, 100);
        }

        function getModalContent() {
            if (state.modal === 'addPerson') return modalAddPerson();
            if (state.modal === 'editPerson') return modalEditPerson();
            if (state.modal === 'addSession') return modalAddSession();
            if (state.modal === 'confirmDelete') return modalConfirmDelete();
            return '';
        }

        function modalAddPerson() {
            return `<div class="modal">
    <div class="modal-header">
      <div class="modal-title">Nuevo Atleta</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Nombre</label>
        <input class="form-input" id="f-name" placeholder="Nombre completo">

      <div class="form-group">
        <label class="form-label">Objetivo</label>
        <select class="form-select" id="f-goal">
          ${GOALS.map(g => `<option value="${g}">${g || 'Sin objetivo'}</option>`).join('')}

      </div>
      <div class="form-section">Primera Medición</div>
      <div class="form-group">
        <label class="form-label">Fecha</label>
        <input class="form-input" type="date" id="f-date" value="${today()}">
      </div>
      ${renderMeasurementFields()}
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="submitAddPerson()">Guardar Atleta</button>
    </div>
  </div>`;
        }

        function modalEditPerson() {
            const p = getPerson(state.personId);
            return `<div class="modal">
    <div class="modal-header">
      <div class="modal-title">Editar Atleta</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">

        function modalAddSession() {
            const p = getPerson(state.personId);
            const lastSess = sortedSessions(p);
            const last = lastSess[lastSess.length - 1];
            return `<div class="modal">
    <div class="modal-header">
      <div class="modal-title">Nueva Medición — ${p.name}</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">

      <p class="form-hint" style="margin-bottom:12px">Deja en blanco los que no aplican</p>
      ${renderMeasurementFields(last?.m)}
    </div>

      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="submitAddSession()">Guardar Medición</button>
    </div>
  </div>`;
        }

        function modalConfirmDelete() {
            const { type, id, parentId } = state.deleteTarget;
            const msg = type === 'person'
                ? `¿Eliminar al atleta <strong>${getPerson(id)?.name}</strong> y todas sus mediciones? Esta acción no se puede deshacer.`
                : `¿Eliminar esta sesión de medición? Esta acción no se puede deshacer.`;
            return `<div class="modal" style="max-width:400px">
    <div class="modal-header">
      <div class="modal-title" style="color:var(--red)">Confirmar Eliminación</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" style="color:var(--text-muted)">${msg}</div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger" onclick="execDelete()">Sí, eliminar</button>
    </div>
  </div>`;
        }

        function renderMeasurementFields(prefill) {
            const groups = {};
            FIELDS.forEach(f => { (groups[f.group] = groups[f.group] || []).push(f); });
            let html = '';
            Object.entries(groups).forEach(([grp, fields]) => {
                html += `<div class="form-section">${grp}</div><div class="form-grid">`;
                fields.forEach(f => {
                    const val = prefill?.[f.key] ?? '';
                    html += `<div class="form-group">
        <label class="form-label">${f.label}</label>
        <input class="form-input" type="number" step="0.1" min="0" id="m-${f.key}" placeholder="cm" value="${val}">
      </div>`;
                });
                html += `</div>`;
            });
            return html;
        }

        function getMeasurementsFromForm() {
            const m = {};
            FIELDS.forEach(f => {
                const el = document.getElementById(`m-${f.key}`);
                if (el && el.value !== '') m[f.key] = parseFloat(el.value);
            });
            return m;
        }

        // ─── BIND EVENTS ───
        function bindEvents() {
            // handled via inline onclick
        }
        function bindModalEvents() {
            document.addEventListener('keydown', function esc(e) {
                if (e.key === 'Escape') { closeModal(); document.removeEventListener('keydown', esc); }
            }, { once: true });
        }

        // ════════════════════════════════════════════
        //  ACTIONS
        // ════════════════════════════════════════════
        function openPerson(id) { state.personId = id; state.view = 'person'; state.tab = 'tabla'; render(); window.scrollTo(0, 0); }
        function goBack() { state.view = 'dashboard'; state.personId = null; render(); }
        function switchTab(tab) { state.tab = tab; render(); }
        function openModal(type) { state.modal = type; render(); }
        function closeModal() {
            state.modal = null;
            const overlay = document.getElementById('modal-overlay');
            if (overlay) overlay.remove();
            // Re-render person if in person view to update without full re-render
        }

        function submitAddPerson() {
            const name = document.getElementById('f-name')?.value?.trim();
            if (!name) { toast('Ingresa un nombre', 'error'); return; }
            const goal = document.getElementById('f-goal')?.value || '';
            const date = document.getElementById('f-date')?.value || today();
            const m = getMeasurementsFromForm();
            const person = {
                id: uid(), name, goal,
                sessions: [{ id: uid(), date, notes: '', m }]
            };
            state.data.people.push(person);
            saveData(state.data);
            closeModal();
            toast(`${name} agregado ✓`, 'success');
            render();
        }

        function submitEditPerson() {
            const p = getPerson(state.personId);
            const name = document.getElementById('f-name')?.value?.trim();
            if (!name) { toast('Ingresa un nombre', 'error'); return; }
            p.name = name;
            p.goal = document.getElementById('f-goal')?.value || '';
            saveData(state.data);
            closeModal();
            toast('Cambios guardados ✓', 'success');
            render();
        }

        function submitAddSession() {
            const p = getPerson(state.personId);
            const date = document.getElementById('f-date')?.value || today();
            const notes = document.getElementById('f-notes')?.value || '';
            const m = getMeasurementsFromForm();
            if (!Object.keys(m).length) { toast('Agrega al menos una medida', 'error'); return; }
            if (p.sessions.find(s => s.date === date)) {
                toast('Ya existe una medición en esa fecha', 'error'); return;
            }
            p.sessions.push({ id: uid(), date, notes, m });
            saveData(state.data);
            closeModal();
            toast('Medición guardada ✓', 'success');
            render();
        }

        function confirmDelete(type, id, parentId) {
            state.deleteTarget = { type, id, parentId };
            state.modal = 'confirmDelete';
            render();
        }

        function execDelete() {
            const { type, id, parentId } = state.deleteTarget;
            if (type === 'person') {
                state.data.people = state.data.people.filter(p => p.id !== id);
                saveData(state.data);
                closeModal();
                toast('Atleta eliminado', 'error');
                state.view = 'dashboard';
                state.personId = null;
                render();
            } else if (type === 'session') {
                const p = getPerson(parentId);
                if (p) {
                    p.sessions = p.sessions.filter(s => s.id !== id);
                    saveData(state.data);
                }
                closeModal();
                toast('Sesión eliminada', 'error');
                render();
            }
        }

        // ─── EXPORT / IMPORT ───
        function exportData() {
            const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `gymtrack_backup_${today()}.json`;
            a.click();
            toast('Datos exportados ✓', 'success');
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    const d = JSON.parse(ev.target.result);
                    if (!d.people) throw new Error('Formato inválido');
                    state.data = d;
                    saveData(d);
                    state.view = 'dashboard';
                    render();
                    toast('Datos importados ✓', 'success');
                } catch (err) {
                    toast('Error al importar: archivo inválido', 'error');
                }
            };
            reader.readAsText(file);
        }

        // ─── TOAST ───
        function toast(msg, type = 'success') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = `show ${type}`;
            clearTimeout(el._t);
            el._t = setTimeout(() => { el.className = ''; }, 3000);
        }

        // ─── INIT ───
        render();

        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.classList.add('hidden');
                    setTimeout(() => splash.remove(), 500); // cleanup DOM
                }
            }, 1800); // 1.8 seconds splash
        });
    </script>
</body>

</html>
